[workspace]
resolver = "3"
members = ["crates/kestrel", "crates/kestrel-supervisor"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jtmthf/kestrel"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
