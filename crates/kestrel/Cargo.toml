[package]
name = "kestrel"
description = "kestrel's control plane: one binary, roles selected by argv."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
futures-core = "0.3"
getrandom = { version = "0.4", features = ["std"] }
jiff = "0.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
tempfile = "3"
tiny_http = "0.12"
