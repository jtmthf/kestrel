name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: workspace (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The rust version comes from rust-toolchain.toml.
      - uses: jdx/mise-action@v4
        with:
          install_args: rust

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build the binaries
        run: cargo build --locked --workspace

      - name: Test
        run: cargo test --locked --workspace

      - name: Record the supervisor binary's size
        run: |
          cargo build --locked --release --package kestrel-supervisor
          size=$(wc -c < target/release/kestrel-supervisor)
          echo "kestrel-supervisor: $size bytes ($((size / 1024)) KiB)" >> "$GITHUB_STEP_SUMMARY"
