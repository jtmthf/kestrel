name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: workspace (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The rust version comes from rust-toolchain.toml.
      - uses: jdx/mise-action@v4
        with:
          install_args: rust

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build the binaries
        run: cargo build --locked --workspace

      - name: Test
        run: cargo test --locked --workspace

      - name: Record the supervisor binary's size
        run: |
          cargo build --locked --release --package kestrel-supervisor
          size=$(wc -c < target/release/kestrel-supervisor)
          echo "kestrel-supervisor: $size bytes ($((size / 1024)) KiB)" >> "$GITHUB_STEP_SUMMARY"

  image:
    name: kestrel-env (image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          install_args: rust

      - uses: Swatinem/rust-cache@v2

      - name: Build the image
        run: |
          started=$(date +%s)
          docker build --file images/kestrel-env/Dockerfile --tag kestrel-env:test .
          echo "built_in=$(($(date +%s) - started))" >> "$GITHUB_ENV"

      - name: Record the image's size and build time
        run: |
          size=$(docker image inspect kestrel-env:test --format '{{.Size}}')
          echo "kestrel-env: $((size / 1024 / 1024)) MiB, built in ${built_in}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Test the image
        run: cargo test --locked --package kestrel --test image -- --ignored
