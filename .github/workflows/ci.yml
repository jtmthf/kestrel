name: CI

# The merge gate (ADR-0027): every pull request and every merge-queue entry runs it, and
# nothing filters it. `paths:` is impossible on `merge_group`, and a workflow kept from
# starting leaves its required check pending forever, so which areas run is decided inside,
# by the `changes` job, rather than by the trigger.
on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      images: ${{ steps.detect.outputs.images }}
      arm64: ${{ steps.detect.outputs.arm64 }}
      compose: ${{ steps.detect.outputs.compose }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Work out which areas the change touches
        id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE}" && -n "${HEAD}" ]]; then
            git diff --name-only "${BASE}...${HEAD}" | .github/scripts/changed-areas.sh
          else
            .github/scripts/changed-areas.sh < /dev/null
          fi

  workspace:
    name: workspace (rust)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The rust version comes from rust-toolchain.toml.
      - uses: jdx/mise-action@v4
        with:
          install_args: rust

      # One cache shared by every job that compiles Rust; only a push to main writes it (ADR-0027).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-dependencies
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build the binaries
        run: cargo build --locked --workspace

      - name: Test
        run: cargo test --locked --workspace

  # Each image is built once for the change and pushed tagged by the commit, so every job that
  # needs one pulls rather than builds it (ADR-0027). Layer caching is restored on every run and
  # written only by a trusted push to main, which is what keeps it warm for everyone else. The
  # image inputs changed with the Rust sources, so these follow the `images` area.
  build-env:
    name: kestrel-env (build)
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image once for this change
        env:
          IMAGE: ghcr.io/${{ github.repository }}-env:${{ github.sha }}
          TRUSTED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          started=$(date +%s)
          cache=(--cache-from "type=gha,scope=kestrel-env")
          if [[ "${TRUSTED}" == "true" ]]; then
            cache+=(--cache-to "type=gha,mode=max,scope=kestrel-env")
          fi
          docker buildx build \
            --file images/kestrel-env/Dockerfile \
            --tag "${IMAGE}" \
            "${cache[@]}" \
            --load .
          docker push "${IMAGE}"
          size=$(docker image inspect "${IMAGE}" --format '{{.Size}}')
          echo "kestrel-env: $((size / 1024 / 1024)) MiB, built in $(($(date +%s) - started))s" >> "$GITHUB_STEP_SUMMARY"

  build-control-plane:
    name: kestrel (build)
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image once for this change
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
          TRUSTED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          started=$(date +%s)
          cache=(--cache-from "type=gha,scope=kestrel")
          if [[ "${TRUSTED}" == "true" ]]; then
            cache+=(--cache-to "type=gha,mode=max,scope=kestrel")
          fi
          docker buildx build \
            --file images/kestrel/Dockerfile \
            --tag "${IMAGE}" \
            "${cache[@]}" \
            --load .
          docker push "${IMAGE}"
          size=$(docker image inspect "${IMAGE}" --format '{{.Size}}')
          echo "kestrel: $((size / 1024 / 1024)) MiB, built in $(($(date +%s) - started))s" >> "$GITHUB_STEP_SUMMARY"

  image:
    name: kestrel-env (image)
    needs: [changes, build-env]
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    env:
      KESTREL_ENV_IMAGE_SOURCE: ghcr.io/${{ github.repository }}-env:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          install_args: rust

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-dependencies
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Pull the image this change built
        run: docker pull "${KESTREL_ENV_IMAGE_SOURCE}"

      - name: Test the image
        run: cargo test --locked --package kestrel --test image -- --ignored

      - name: Test the Docker driver
        run: cargo test --locked --package kestrel --test docker -- --ignored

      # One agent runtime, one model stub and one host daemon, so a Run at a time.
      - name: Test the agent runtime the image ships
        run: cargo test --locked --package kestrel --test opencode -- --ignored --test-threads 1

  development:
    name: kestrel-dev (image)
    needs: [changes, build-env]
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    env:
      KESTREL_ENV_IMAGE_SOURCE: ghcr.io/${{ github.repository }}-env:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          install_args: rust

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-dependencies
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Pull the image this change built
        run: docker pull "${KESTREL_ENV_IMAGE_SOURCE}"

      # kestrel_passes_its_own_checks compiles the workspace three times, so the scheduled
      # Development image workflow runs it instead.
      - name: Test the image
        run: |
          started=$(date +%s)
          cargo test --locked --package kestrel --test development -- --ignored \
            --skip kestrel_passes_its_own_checks
          image=$(docker image ls --filter 'reference=kestrel-dev:test-*' --format '{{.Repository}}:{{.Tag}}' | head -n 1)
          size=$(docker image inspect "$image" --format '{{.Size}}')
          echo "kestrel-dev: $((size / 1024 / 1024)) MiB, built and tested in $(($(date +%s) - started))s" >> "$GITHUB_STEP_SUMMARY"

  control-plane:
    name: kestrel (image)
    needs: [changes, build-control-plane]
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    env:
      KESTREL_CONTROL_IMAGE_SOURCE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          install_args: rust

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-dependencies
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Pull the image this change built
        run: docker pull "${KESTREL_CONTROL_IMAGE_SOURCE}"

      - name: Test the image
        run: cargo test --locked --package kestrel --test control_plane -- --ignored

  compose:
    name: kestrel (compose)
    needs: [changes, build-env, build-control-plane]
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    env:
      KESTREL_ENV_IMAGE_SOURCE: ghcr.io/${{ github.repository }}-env:${{ github.sha }}
      KESTREL_CONTROL_IMAGE_SOURCE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          install_args: rust

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-dependencies
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Pull the images this change built
        run: |
          docker pull "${KESTREL_ENV_IMAGE_SOURCE}"
          docker pull "${KESTREL_CONTROL_IMAGE_SOURCE}"

      # A checkout's compose suite is scoped to a namespace derived from its path, so the
      # stack comes up once at a time per checkout rather than once per machine.
      - name: Test the compose path
        run: cargo test --locked --package kestrel --test compose -- --ignored --test-threads 1

  # The only job that builds the arm64 half of the image: the release it pins, the checksum it
  # verifies, and the architecture it selects on.
  architectures:
    name: images (arm64)
    needs: changes
    if: needs.changes.outputs.arm64 == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the agent runtime for arm64
        run: |
          docker buildx build --platform linux/arm64 --target opencode \
            --output type=cacheonly --file images/kestrel-env/Dockerfile .

      - name: Build gh for arm64
        run: |
          docker buildx build --platform linux/arm64 --target gh \
            --output type=cacheonly --file images/kestrel-dev/Dockerfile .

  # The one status branch protection and the merge queue name. It runs whether an area ran,
  # failed or was skipped: a job skipped by its condition reports success, and only a check
  # that never reports at all strands a pull request.
  gate:
    name: gate
    needs:
      - changes
      - workspace
      - build-env
      - build-control-plane
      - image
      - development
      - control-plane
      - compose
      - architectures
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when an area failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

      - name: Report the gate
        run: echo "Every area passed or was skipped."
