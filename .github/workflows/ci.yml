name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    name: control plane (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The rust version comes from rust-toolchain.toml. bun is here because the primary test
      # seam provisions an Environment running the real supervisor binary.
      - uses: jdx/mise-action@v4
        with:
          install_args: rust bun

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build the kestrel binary
        run: cargo build --locked --workspace

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: cargo test --locked --workspace

  supervisor:
    name: supervisor (typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          install_args: bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the link client against the document it is generated from
        run: |
          bun run generate
          git diff --exit-code

      - name: Typecheck
        run: bun run typecheck

      - name: Build the supervisor binary
        run: bun run build

      - name: Test
        run: bun test
