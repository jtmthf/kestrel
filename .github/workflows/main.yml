name: Main

# What a push to main does that a pull request does not (ADR-0027): it records the supervisor's
# size and publishes the control-plane image. It is not a required check, so it may name the
# branch it runs on, and it builds from a clean checkout so what is published is what the
# Dockerfile yields on its own.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  supervisor-size:
    name: supervisor size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          install_args: rust

      - uses: Swatinem/rust-cache@v2

      - name: Record the supervisor binary's size
        run: |
          started=$(date +%s)
          cargo build --locked --release --package kestrel-supervisor
          size=$(wc -c < target/release/kestrel-supervisor)
          echo "kestrel-supervisor: $size bytes ($((size / 1024)) KiB), built in $(($(date +%s) - started))s" >> "$GITHUB_STEP_SUMMARY"

  # From a clean checkout with no build cache, so what is published is what the Dockerfile
  # yields on its own. Publishing when the image inputs changed, and on a release tag, is
  # #244.
  publish:
    name: kestrel (publish)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the control-plane image
        run: |
          docker build --file images/kestrel/Dockerfile \
            --tag ghcr.io/${{ github.repository }}:latest \
            --tag ghcr.io/${{ github.repository }}:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
